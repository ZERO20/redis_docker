# Archivo de configuración de Redis para entorno de pruebas

# Guardar datos en disco
save 60 1

# Configuraciones de memoria
maxmemory 256mb
maxmemory-policy allkeys-lru

# Configuración de red
bind 0.0.0.0
protected-mode yes
port 6379

# Configuración de logs
loglevel notice
logfile ""

# Ajustes de rendimiento
appendonly yes
appendfsync everysec

# Configuraciones adicionales de seguridad
# Configuración comentada. Descomentar y establecer contraseña si es necesario
# requirepass tuContraseñaSegura 